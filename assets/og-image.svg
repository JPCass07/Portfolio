<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Vector source for og-image.png. Social apps need the PNG; this keeps the drawing editable.
       The PNG is rendered in the browser so the text uses the real web fonts. -->
  <defs>
    <path id="cube-line" d="M20 4 34 12V28L20 36 6 28V12ZM6 12 20 20 34 12M20 20V36"/>
  </defs>
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <g fill="none" stroke="#E9E9E9" stroke-opacity=".14" stroke-width="1.5">
    <circle cx="935" cy="315" r="262"/>
    <circle cx="935" cy="315" r="222" stroke-dasharray="3 9"/>
    <circle cx="935" cy="315" r="182"/>
  </g>
  <circle cx="935" cy="315" r="262" fill="none" stroke="#00FF41" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86" transform="rotate(-150 935 315)"/>
  <circle cx="1161.9" cy="184" r="7" fill="#00FF41"/>

  <!-- Drifting outline cubes, as on the first version of the site -->
  <g fill="none" stroke="#E9E9E9" stroke-opacity=".22" stroke-width=".9" stroke-linejoin="round">
    <use href="#cube-line" xlink:href="#cube-line" transform="translate(604 14) scale(1.3) rotate(-14 20 20)"/>
    <use href="#cube-line" xlink:href="#cube-line" transform="translate(1100 520) scale(1.1) rotate(18 20 20)"/>
    <use href="#cube-line" xlink:href="#cube-line" transform="translate(700 520) scale(.8) rotate(30 20 20)"/>
  </g>

  <g transform="translate(935 315) scale(8.4) translate(-20 -20)">
    <path fill="#00FF41" d="M20 7 31.5 13.5 20 20 8.5 13.5Z"/>
    <path fill="none" stroke="#E9E9E9" stroke-width=".36" stroke-linejoin="round" stroke-linecap="round" d="M20 7 31.5 13.5V26.5L20 33 8.5 26.5V13.5ZM8.5 13.5 20 20 31.5 13.5M20 20V33"/>
  </g>

  <text x="80" y="112" fill="#929292" font-family="JetBrains Mono, ui-monospace, monospace" font-size="21" font-weight="500" letter-spacing="3">COMPUTER SCIENCE · UNIVERSITY OF READING</text>
  <rect x="80" y="148" width="226" height="44" rx="22" fill="#00FF41"/>
  <text x="193" y="177" fill="#0A0A0A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" font-weight="500" letter-spacing="2" text-anchor="middle">JULIO CASSINDA</text>
  <text x="76" y="388" fill="#E9E9E9" font-family="Instrument Serif, Georgia, serif" font-size="84" letter-spacing="-1.5">Close to the customer,</text>
  <text x="76" y="472" fill="#929292" font-family="Instrument Serif, Georgia, serif" font-size="84" letter-spacing="-1.5">deep in the system.</text>
  <text x="80" y="560" fill="#929292" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" font-weight="500" letter-spacing="2.5">TANIUM CERTIFIED OPERATOR · OPEN TO 2027 INTERNSHIPS</text>
</svg>
